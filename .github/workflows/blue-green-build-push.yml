name: blue-green-build-push

# Se dispara automáticamente en cada push a la branch dev, pero solo si
# el cambio toca esta actividad o el propio workflow.
on:
  push:
    branches: [dev]
    paths:
      - "actividad-cicd-blue-green/**"
      - ".github/workflows/blue-green-build-push.yml"

env:
  IMAGE_NAME: notes-api-blue-green

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Se construyen y publican ambas versiones (v1 = blue, v2 = green)
    # a partir del mismo Dockerfile, usando el build-arg APP_VERSION.
    strategy:
      matrix:
        app_version: [v1, v2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags: uno "flotante" por versión (v1/v2) para uso local/manual,
      # y uno inmutable con el SHA del commit para trazabilidad
      # (ver "2026-09-01 CI-CD.md", sección 8: nunca usar solo latest).
      - name: Build and push image (${{ matrix.app_version }})
        uses: docker/build-push-action@v6
        with:
          context: actividad-cicd-blue-green
          build-args: |
            APP_VERSION=${{ matrix.app_version }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ matrix.app_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ matrix.app_version }}-${{ github.sha }}
